name: Časopisy – ověření feedů

# Dočasné: jen pro větev akce-testbeh. Přečte feedy nových časopisů
# (bez AI) a vypíše, co v nich je. Výsledek commitne do téže větve.
on:
  push:
    branches: [akce-testbeh]
    paths-ignore: ['build/**']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Feedy
        env:
          SKIP_GEMINI: '1'
        run: |
          mkdir -p build
          python - <<'PY' 2>&1 | tee build/feedy2.txt
          import requests, json, scraper_journals as s
          UA = {"User-Agent": s.CROSSREF_UA}
          h = {"User-Agent": s.USER_AGENT, "Accept": "application/rss+xml, application/xml;q=0.9, */*;q=0.5"}
          r = requests.get("https://kluwerlawonline.com/feeds/COLA", headers=h, timeout=30)
          open("build/kluwer_cola.xml", "wb").write(r.content)
          print("Kluwer", r.status_code, r.headers.get("Content-Type"), len(r.content))
          for issn in ("1744-1048", "1757-8418"):
              m = requests.get(f"https://api.crossref.org/journals/{issn}", headers=UA, timeout=30)
              if m.status_code != 200:
                  print(issn, m.status_code); continue
              j = m.json()["message"]
              w = requests.get(f"https://api.crossref.org/journals/{issn}/works",
                               params={"sort": "created", "order": "desc", "rows": 3, "select": "DOI,title,created"},
                               headers=UA, timeout=30).json()["message"]["items"]
              print(issn, j["title"], j.get("issn-type"), j["counts"]["total-dois"],
                    [(x["created"]["date-time"][:10], (x.get("title") or [""])[0][:50]) for x in w])
          for label, nazev, feed, ref, issn, vyd in s.DALSI_FEEDY:
              if label == "CMLRev":
                  for i in s.fetch_publisher_rss(feed, label, nazev, ref)[:5]:
                      print("  ", i["pub_date"], i.get("pub_date_odhad"), "|", i["title"], "|", i["authors"])
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build && git commit -m "Feedy" && git push
