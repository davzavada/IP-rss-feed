name: Týdenní newsletter

on:
  schedule:
    # Cron je vždy v UTC; míříme na pondělí 8:30 pražského času. Startujeme
    # o deset minut dřív (8:20) – GitHub scheduled běhy pouští se zpožděním
    # (proč zrovna necelá hodina, viz update-feed.yml). Praha přechází mezi
    # CEST (UTC+2) a CET (UTC+1), takže jsou tu dva výrazy a projde ten, ze
    # kterého 8:20 vychází; ten druhý skončí hned na začátku.
    #
    # Dvoutýdenní přehled se generuje v pondělí ráno (update-feed.yml). Když
    # se to nestihne, protože GitHub žádný běh v ranním okně nepustil,
    # dogeneruje si ho tenhle workflow sám (krok „Přehled, když je starý").
    - cron: '20 6 * * 1'   # 06:20 UTC = 8:20 CEST
    - cron: '20 7 * * 1'   # 07:20 UTC = 8:20 CET
  workflow_dispatch:       # ruční spuštění
    inputs:
      dry_run:
        description: 'Jen sestavit náhled, neodesílat'
        type: boolean
        default: false

# Zápis jen kvůli dogenerovanému přehledu – jinak se nic necommituje.
permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Naplánovat běh
        id: plan
        run: |
          if [ "$(TZ=Europe/Prague date +%z)" = "+0200" ]; then
            want='20 6 * * 1'   # CEST: 8:20 Praha = 06:20 UTC
          else
            want='20 7 * * 1'   # CET:  8:20 Praha = 07:20 UTC
          fi
          schedule='${{ github.event.schedule }}'
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] || [ "$schedule" = "$want" ]; then
            send=true
          else
            send=false
          fi
          # Přehled je starý, když nevznikl dnes – pondělní běh update-feed
          # nejspíš nedorazil. Bez data (soubor chybí) se bere jako starý.
          dnes=$(TZ=Europe/Prague date +%F)
          vznik=$(TZ=Europe/Prague date -d \
            "$(grep -m1 '"generated"' docs/digest.json | cut -d'"' -f4)" +%F 2>/dev/null || true)
          if [ "$send" = true ] && [ "$vznik" != "$dnes" ]; then stale=true; else stale=false; fi
          echo "send=$send" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "cron '$schedule' -> odeslat: $send (v tomhle pololetí jede '$want'); přehled z '${vznik:-?}', dogenerovat: $stale"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.send == 'true'
        with:
          python-version: '3.12'

      # Newsletter sám si vystačí se standardní knihovnou; requirements jsou
      # potřeba jen pro digest.py (requests).
      - name: Install dependencies
        if: steps.plan.outputs.stale == 'true'
        run: pip install -r requirements.txt

      # Záloha za pondělní běh update-feed.yml: přehled se napíše z feedů,
      # které v repozitáři leží, a uloží se, ať ho vidí i stránka.
      - name: Přehled, když je starý
        if: steps.plan.outputs.stale == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_FORCE: '1'
        run: |
          python digest.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest.json
          git diff --cached --quiet || git commit -m "Dvoutýdenní přehled $(date -u +%Y-%m-%d) (záloha z newsletteru)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done

      # Bez nastavených secrets jen vypíše, že nemá kam poslat, a skončí v pořádku.
      - name: Poslat newsletter
        if: steps.plan.outputs.send == 'true'
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_UNSUBSCRIBE_URL: ${{ secrets.MAIL_UNSUBSCRIBE_URL }}
          MAIL_DRY_RUN: ${{ inputs.dry_run }}
        run: python newsletter.py

      # Náhled zprávy k nahlédnutí u běhu – ať se dá zkontrolovat, co odešlo.
      - name: Náhled jako artefakt
        if: steps.plan.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: build/
          if-no-files-found: ignore
          retention-days: 14
