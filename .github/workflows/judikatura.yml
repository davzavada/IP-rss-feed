name: Judikatura

on:
  schedule:
    # Jednou denně ve 2:00 pražského času. Cron počítá v UTC, proto dva
    # výrazy – 0:00 UTC je 2:00 v letním čase, 1:00 UTC ve 2:00 v zimním;
    # krok „Naplánovat běh" pustí ten, který odpovídá (podle výrazu, který
    # běh vyvolal – GitHub scheduled běhy chodí i s hodinovým zpožděním).
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      soudy:
        description: 'Soudy oddělené čárkou (prázdné = všechny s adaptérem)'
        type: string
        default: ''
      skip_gemini:
        description: 'Jen objevování, bez AI shrnutí'
        type: boolean
        default: false
      max_polozek:
        description: 'Kolik rozhodnutí smí AI v tomto běhu zpracovat'
        type: string
        default: '300'

permissions:
  contents: write

# Souběžné běhy by zapisovaly do stejného archivu – další běh počká ve frontě.
concurrency:
  group: judikatura
  cancel-in-progress: false

jobs:
  judikatura:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Špička větve, ne commit z doby spuštění – běh čekající ve frontě
          # tak začne i s ručními úpravami, které mezitím přibyly.
          ref: ${{ github.ref }}
          # Kus historie, ať rebase před pushem nemusí dotahovat všechno.
          fetch-depth: 50

      # Jeden běh denně ve 2:00: soudy zveřejňují přes den, ráno je tak hotovo
      # všechno z předchozího dne. Ruční spuštění běží vždy.
      - name: Naplánovat běh
        id: plan
        run: |
          posun=$(TZ=Europe/Prague date +%z)
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            run=true; duvod='ruční spuštění'
          else
            case "${{ github.event.schedule }}|$posun" in
              '0 0 * * *|+0200'|'0 1 * * *|+0100') run=true; duvod='denní běh ve 2:00' ;;
              *) run=false; duvod='tento cron není 2:00 v Praze (druhý výraz je pro jiný čas roku)' ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$(TZ=Europe/Prague date '+%a %H:%M %Z') -> $run ($duvod)"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: pip install -r requirements.txt

      # Archiv i okna se ukládají hned po objevování a archiv pak po každém
      # rozhodnutí; když krok spadne nebo vyprší, commit níže uloží aspoň to,
      # co se stihlo. Selhání soudu (výpadek, změna webu) skript ohlásí
      # ::error:: a kódem 1 až po uložení všeho – job pak zčervená v kroku
      # „Výsledek sběru“. AI_MAX_MINUT je rozpočet celého běhu od začátku;
      # 25 minut do limitu kroku je rezerva na poslední volání AI a přepis
      # hesel. `exec`, ať SIGINT při vypršení kroku dostane přímo Python
      # (dokončí zápis oken a stav.json).
      - name: Sběr judikatury
        id: sber
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 110
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
          SOUDY: ${{ inputs.soudy }}
          AI_MAX_POLOZEK: ${{ inputs.max_polozek || '300' }}
          AI_MAX_MINUT: '85'
        run: exec python scraper_judikatura.py

      # Pojistka pro běh ukončený natvrdo (SIGKILL): okna znovu z uloženého
      # archivu, ať neukazují záznam, který archiv mezitím nahradil.
      - name: Okna pro web
        if: always() && steps.plan.outputs.run == 'true' && steps.sber.outcome != 'success'
        continue-on-error: true
        run: python scraper_judikatura.py --jen-export

      # Rozbitý archiv nebo okno se necommituje – další běh začne z posledního
      # dobrého stavu a selhání přijde jako upozornění.
      - name: Kontrola dat
        id: kontrola
        if: always() && steps.plan.outputs.run == 'true'
        run: python -m judikatura.kontrola

      - name: Commit & push
        id: commit
        if: always() && steps.plan.outputs.run == 'true' && steps.kontrola.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/judikatura docs/data/judikatura
          if git diff --cached --quiet; then
            echo "Beze změn."
            exit 0
          fi
          git commit -m "Update case law $(date -u +%Y-%m-%d)"
          # Main se mohl mezitím pohnout (feedy, ruční úpravy). Archiv jiný
          # workflow nepíše, takže rebase většinou projde. Konflikt znamená
          # ruční úpravu archivu nebo oken během běhu (ruční heslo, shrnutí) –
          # tu nepřepisovat (-X theirs by ji smazal): rebase zrušit, výsledky
          # běhu dát do artefaktu a krok shodit.
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $(( i * 5 ))
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Konflikt s ručními úpravami na main – výsledky běhu nejsou pushnuté (artefakt judikatura-vysledky), ruční úpravy zůstaly. Další běh práci zopakuje."
              exit 1
            fi
          done
          echo "::error::Push se nepovedl ani na čtvrtý pokus – výsledky běhu jsou v artefaktu judikatura-vysledky."
          exit 1

      - name: Výsledky běhu jako artefakt
        if: always() && steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: judikatura-vysledky
          path: |
            data/judikatura
            docs/data/judikatura
          retention-days: 14

      - name: Výsledek sběru
        if: steps.sber.outcome == 'failure'
        run: |
          echo "::error::Sběr judikatury skončil chybou nebo některý soud selhal – viz krok „Sběr judikatury“ a data/judikatura/stav.json (co se uložilo, je commitnuté)."
          exit 1
