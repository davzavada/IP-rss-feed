name: Update RSS Feed

on:
  schedule:
    # Cron neurčuje, kdy se scrapuje – jen jak často se workflow ozve. GitHub
    # totiž scheduled běhy nedoručuje spolehlivě: od konce srpna 2026 chodí
    # se zpožděním hodin, celé dny mlčí (27. a 31. 8.) a hlavně jich pustí
    # jen zlomek. Naplánováno je 24 výskytů denně, reálně dorazí zhruba
    # jeden za tři až pět hodin – zahustit cron víc nepomůže, GitHub ostatní
    # výskyty zahodí. Kdy se opravdu pracuje, rozhoduje až krok „Naplánovat
    # běh" podle skutečného pražského času.
    - cron: '5 * * * *'
  workflow_dispatch:       # ruční spuštění
    inputs:
      skip_gemini:
        description: 'Přeskočit generování AI shrnutí (Gemini)'
        type: boolean
        default: false

permissions:
  contents: write

# Scraper běží i přes 20 minut (AI shrnutí) – souběžné běhy by si navzájem
# rozbily push. Další běh počká ve frontě, místo aby jel paralelně.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Rozhodnutí, jestli okno už má svůj běh za sebou, se dělá podle data
          # posledního commitu s feedy – na to je potřeba kus historie, ne HEAD.
          fetch-depth: 50

      # Feed má být hotový v 7:00 a ve 14:00 pražského času. Protože běhy chodí
      # řídce a nepředvídatelně, nestačí čekat na jeden ve správnou chvíli:
      # okna jsou proto široká (23:00–7:00 a 9:00–14:00) a uvnitř nich se
      # scrapuje pokaždé, když je feed starší než dvě hodiny. Každý běh, který
      # do okna spadne, tak posune data blíž k cíli – a ten poslední před 7:00
      # nebo 14:00 rozhoduje o tom, co uživatel uvidí. Mimo okna se nedělá nic.
      #
      # Všechno se počítá v Europe/Prague, takže přechod mezi letním a zimním
      # časem se řeší sám a nejsou kvůli němu potřeba zdvojené cron výrazy.
      - name: Naplánovat běh
        id: plan
        run: |
          hour=$(TZ=Europe/Prague date +%-H)
          dnes=$(TZ=Europe/Prague date +%F)
          # Poslední commit s feedy = kdy naposled nějaký běh práci opravdu
          # udělal. Když žádný takový v historii není, ber to jako dávno.
          last=$(git log --grep='^Update RSS feeds' -1 --format=%ct)
          stari=$(( $(date +%s) - ${last:-0} ))

          if [ "$hour" -ge 23 ] || [ "$hour" -lt 7 ]; then
            window=ranni
          elif [ "$hour" -ge 9 ] && [ "$hour" -lt 14 ]; then
            window=odpoledni
          else
            window=zadne
          fi

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            scrape=true; duvod='ruční spuštění'
          elif [ "$window" = zadne ]; then
            scrape=false; duvod='mimo okna'
          elif [ "$stari" -lt 7200 ]; then
            scrape=false; duvod="okno $window, feed je mladší než dvě hodiny"
          else
            scrape=true; duvod="okno $window"
          fi

          # Dvoutýdenní přehled jednou týdně: v pondělí ráno, ať je hotový dřív,
          # než si pro něj v 8:30 přijde newsletter. Ranní okno začíná už v neděli
          # ve 23:00, proto se kromě dne hlídá i to, že je po půlnoci. Když už
          # dnešní přehled existuje, podruhé se negeneruje – během jednoho rána
          # se do okna vejde víc scrapovacích běhů.
          digest=false
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            digest=true
          elif [ "$scrape" = true ] && [ "$window" = ranni ] && [ "$hour" -lt 7 ] \
               && [ "$(TZ=Europe/Prague date +%u)" = "1" ]; then
            prehled=$(TZ=Europe/Prague date -d \
              "$(grep -m1 '"generated"' docs/digest.json | cut -d'"' -f4)" +%F 2>/dev/null || true)
            [ "$prehled" = "$dnes" ] || digest=true
          fi

          echo "scrape=$scrape" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$(TZ=Europe/Prague date '+%a %H:%M %Z'), feed starý $(( stari / 60 )) min -> scrapery: $scrape, přehled: $digest ($duvod)"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.scrape == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.plan.outputs.scrape == 'true'
        run: pip install -r requirements.txt

      - name: Run scrapers
        if: steps.plan.outputs.scrape == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
        run: |
          python scraper.py
          python scraper_ipcuria.py
          python scraper_journals.py
          # Kalendář jednání závisí na dokumentech na msp.gov.cz – když se
          # nepovede, ať nezablokuje commit ostatních feedů.
          python scraper_hearings.py || echo "::warning::scraper_hearings selhal, feedy jedou dál"

      # Přehled čte hotové feedy, takže běží až po scraperech – jednou týdně,
      # v pondělí ráno. Ručně spuštěný běh ho udělá taky. DIGEST_FORCE říká
      # digest.py, ať přehled napíše znovu i tehdy, když se vstup od minula
      # nezměnil – jednou týdně chceme čerstvý text, ne ten čtrnáct dní starý.
      - name: Dvoutýdenní přehled (pondělí ráno)
        if: steps.plan.outputs.digest == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
          DIGEST_FORCE: '1'
        run: python digest.py

      - name: Commit & push feeds
        if: steps.plan.outputs.scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ feed_seen.json journals_seen.json journals_meta.json feed_meta.json ipcuria_seen.json ipcuria_meta.json hearings_config.json
          git diff --cached --quiet || git commit -m "Update RSS feeds $(date -u +%Y-%m-%d)"
          # Kdyby se main mezitím pohnul (dlouhý běh scraperu), přebasuj a zkus
          # znovu; u konfliktů v generovaných souborech vyhrává naše novější verze.
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done
