name: Update RSS Feed

on:
  schedule:
    # Pouštíme se každou hodinu, ale scrapuje se jen dvakrát denně. Zní to
    # obráceně, tak proč: GitHub scheduled běhy nespouští v naplánovaný čas –
    # od konce srpna 2026 je doručuje se zpožděním 4 až 7 hodin (a předtím
    # celé sloty zahazoval). Kdy běh přijde, se tedy naplánovat nedá; dá se
    # jen zařídit, aby nějaký běh přišel často, a rozhodnutí „scrapovat, nebo
    # ne" udělat až uvnitř podle skutečného pražského času (viz „Naplánovat
    # běh"). Minuta 5 je schválně mimo celou hodinu – na začátku hodiny má
    # fronta špičku.
    - cron: '5 * * * *'
  workflow_dispatch:       # ruční spuštění
    inputs:
      skip_gemini:
        description: 'Přeskočit generování AI shrnutí (Gemini)'
        type: boolean
        default: false

permissions:
  contents: write

# Scraper běží i přes 20 minut (AI shrnutí) – souběžné běhy by si navzájem
# rozbily push. Další běh počká ve frontě, místo aby jel paralelně.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Rozhodnutí, jestli okno už má svůj běh za sebou, se dělá podle data
          # posledního commitu s feedy – na to je potřeba kus historie, ne HEAD.
          fetch-depth: 50

      # Feed má být hotový v 7:00 a ve 14:00 pražského času. Scrapuje se proto
      # v oknech, která těmhle časům předcházejí: 4:00–7:00 a 11:00–14:00.
      # Z hodinových běhů okno vždycky nějaký chytí (i při několikahodinovém
      # zpoždění fronty jich do tří hodin dorazí několik) a první z nich práci
      # udělá; ostatní pak vidí čerstvý commit a hned skončí, což trvá deset
      # sekund. Kdyby okno prošlo úplně bez běhu, zmeškanou práci udělá první
      # další – v noci se nescrapuje, čeká se na ranní okno.
      #
      # Všechno se počítá v Europe/Prague, takže přechod mezi letním a zimním
      # časem se řeší sám a nejsou kvůli němu potřeba zdvojené cron výrazy.
      - name: Naplánovat běh
        id: plan
        run: |
          hour=$(TZ=Europe/Prague date +%-H)
          today=$(TZ=Europe/Prague date +%Y-%m-%d)
          # Poslední commit s feedy = kdy naposled nějaký běh práci opravdu
          # udělal. Když žádný takový v historii není, ber to jako dávno.
          last=$(git log --grep='^Update RSS feeds' -1 --format=%ct)
          last=${last:-0}

          # Do 4:00 se nedělá nic. Pak platí ranní cíl, od 11:00 odpolední:
          # feed musí být novější než začátek okna. Když v okně žádný běh
          # nedorazil, splní to první další – proto tu není žádná zvláštní
          # záchranná větev, dohnání zmeškaného okna je totéž rozhodnutí.
          if [ "$hour" -lt 4 ]; then
            window=zadne; start=0
          elif [ "$hour" -lt 11 ]; then
            window=ranni;     start=$(TZ=Europe/Prague date -d "$today 04:00" +%s)
          else
            window=odpoledni; start=$(TZ=Europe/Prague date -d "$today 11:00" +%s)
          fi

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            scrape=true; digest=true; duvod='ruční spuštění'
          elif [ "$window" = zadne ]; then
            scrape=false; digest=false; duvod='noc, na řadě je ranní okno'
          elif [ "$last" -ge "$start" ]; then
            scrape=false; digest=false; duvod="okno $window už má svůj běh"
          elif [ $(( $(date +%s) - last )) -lt 3600 ]; then
            # Ranní okno se dohánělo těsně před 11:00 – ať odpolední hned
            # nescrapuje znovu to samé.
            scrape=false; digest=false; duvod='feed je z poslední hodiny'
          else
            scrape=true; digest=false; duvod="okno $window"
          fi

          # Dvoutýdenní přehled jednou týdně: v pondělí s ranním během, ať je
          # hotový dřív, než si pro něj v 8:30 přijde newsletter.
          if [ "$scrape" = true ] && [ "$window" = ranni ] \
             && [ "$(TZ=Europe/Prague date +%u)" = "1" ]; then
            digest=true
          fi

          echo "scrape=$scrape" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$(TZ=Europe/Prague date '+%a %H:%M %Z') -> scrapery: $scrape, přehled: $digest ($duvod)"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.scrape == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.plan.outputs.scrape == 'true'
        run: pip install -r requirements.txt

      - name: Run scrapers
        if: steps.plan.outputs.scrape == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
        run: |
          python scraper.py
          python scraper_ipcuria.py
          python scraper_journals.py

      # Přehled čte hotové feedy, takže běží až po scraperech – jednou týdně,
      # v pondělí ráno. Ručně spuštěný běh ho udělá taky. DIGEST_FORCE říká
      # digest.py, ať přehled napíše znovu i tehdy, když se vstup od minula
      # nezměnil – jednou týdně chceme čerstvý text, ne ten čtrnáct dní starý.
      - name: Dvoutýdenní přehled (pondělí ráno)
        if: steps.plan.outputs.digest == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
          DIGEST_FORCE: '1'
        run: python digest.py

      - name: Commit & push feeds
        if: steps.plan.outputs.scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ feed_seen.json journals_seen.json journals_meta.json feed_meta.json ipcuria_seen.json ipcuria_meta.json
          git diff --cached --quiet || git commit -m "Update RSS feeds $(date -u +%Y-%m-%d)"
          # Kdyby se main mezitím pohnul (dlouhý běh scraperu), přebasuj a zkus
          # znovu; u konfliktů v generovaných souborech vyhrává naše novější verze.
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done
