name: Časopisy, jednání, akce a přehled

on:
  schedule:
    # Jednou denně ve 2:00 pražského času, stejně jako judikatura. Cron počítá
    # v UTC, proto dva výrazy – 0:00 UTC je 2:00 v letním čase, 1:00 UTC ve
    # 2:00 v zimním; krok „Naplánovat běh" pustí ten, který odpovídá (podle
    # výrazu, který běh vyvolal – GitHub scheduled běhy chodí se zpožděním).
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:       # ruční spuštění
    inputs:
      skip_gemini:
        description: 'Přeskočit generování AI shrnutí (Gemini)'
        type: boolean
        default: false

permissions:
  contents: write

# Scraper běží i přes 20 minut (AI shrnutí) – souběžné běhy by si navzájem
# rozbily push. Další běh počká ve frontě, místo aby jel paralelně.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Kus historie, ať rebase před pushem nemusí dotahovat všechno.
          fetch-depth: 50

      # Jeden běh denně ve 2:00: časopisy a jednání; v pondělí navíc
      # dvoutýdenní přehled, ať je hotový na začátek týdne. Ruční spuštění
      # stáhne všechno a přehled přegeneruje.
      - name: Naplánovat běh
        id: plan
        run: |
          posun=$(TZ=Europe/Prague date +%z)
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            scrape=true; duvod='ruční spuštění'
          else
            case "${{ github.event.schedule }}|$posun" in
              '0 0 * * *|+0200'|'0 1 * * *|+0100') scrape=true; duvod='denní běh ve 2:00' ;;
              *) scrape=false; duvod='tento cron není 2:00 v Praze (druhý výraz je pro jiný čas roku)' ;;
            esac
          fi
          # Přehled: denně s DIGEST_AUTO – digest.py sám pozná, jestli je
          # potřeba (nový týden, minulé selhání, doběhlá rozhodnutí); ruční
          # spuštění ho napíše načisto (DIGEST_FORCE).
          digest=$scrape
          echo "scrape=$scrape" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "jednani=$scrape" >> "$GITHUB_OUTPUT"
          echo "$(TZ=Europe/Prague date '+%a %H:%M %Z') -> scrapery: $scrape, přehled: $digest ($duvod)"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.scrape == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.plan.outputs.scrape == 'true'
        run: pip install -r requirements.txt

      # Judikaturu (NS, NSS, ÚS, SDEU) sbírá judikatura.yml. Každý scraper je
      # samostatný krok: když jeden spadne, ostatní doběhnou a commit uloží,
      # co se povedlo.
      - name: Časopisy
        id: casopisy
        if: steps.plan.outputs.scrape == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
        run: python scraper_journals.py

      # Kalendář jednání závisí na dokumentech na msp.gov.cz.
      - name: Jednání
        id: jednani
        if: steps.plan.outputs.jednani == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
        run: python scraper_hearings.py

      # Kalendář akcí – výpisy pořadatelů (akce_config.json); AI z nich čte
      # akce, kde web nemá strojově čitelná data, a řadí je do oblastí.
      - name: Akce
        id: akce
        if: steps.plan.outputs.scrape == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
        run: python scraper_akce.py

      # Přehled čte hotové výstupy (časopisy, okna judikatury), takže běží až po
      # scraperech. Spouští se každý den s DIGEST_AUTO a digest.py napíše nový
      # jen tehdy, když je potřeba: nový týden (v pondělí), minulý pokus
      # selhal, nebo mezitím doběhla rozhodnutí, která v přehledu chyběla.
      # Ručně spuštěný běh ho napíše načisto (DIGEST_FORCE).
      - name: Dvoutýdenní přehled
        id: prehled
        if: steps.plan.outputs.digest == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_GEMINI: ${{ inputs.skip_gemini }}
          DIGEST_AUTO: '1'
          DIGEST_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python digest.py

      - name: Commit & push
        id: commit
        if: always() && steps.plan.outputs.scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/data/judikatura patří workflow judikatura.yml.
          git add docs/ ':!docs/data/judikatura' data/casopisy journals_seen.json journals_meta.json hearings_config.json
          # Keš klasifikace osob (jen otisky jmen) vzniká prvním během s AI.
          [ -f hearings_osoby.json ] && git add hearings_osoby.json
          git diff --cached --quiet || git commit -m "Update journals, hearings and events $(date -u +%Y-%m-%d)"
          # Kdyby se main mezitím pohnul (dlouhý běh scraperu), přebasuj a zkus
          # znovu. Výstupy jiný běh nepíše (concurrency), takže konflikt znamená
          # ruční úpravu (hearings_config.json) – tu nepřepisovat, rebase zrušit
          # a krok shodit; výstupy běhu jdou do artefaktu. Když push nevyjde
          # ani napočtvrté, krok taky spadne – dřív skončil zeleně bez pushe.
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $(( i * 5 ))
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Konflikt s ruční úpravou na main – výstupy běhu nejsou pushnuté (artefakt vystupy-behu), ruční úpravy zůstaly."
              exit 1
            fi
          done
          echo "::error::Push se nepovedl ani na čtvrtý pokus – výstupy běhu jsou v artefaktu vystupy-behu."
          exit 1

      - name: Výstupy běhu jako artefakt
        if: always() && steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vystupy-behu
          path: |
            docs/
            data/casopisy
            journals_seen.json
            journals_meta.json
            hearings_config.json
          retention-days: 14

      # Commit výše uložil, co se povedlo; selhání se tu jen ohlásí. Jednání
      # (dokumenty na msp.gov.cz) a akce (weby pořadatelů) jen varují, ostatní shodí běh,
      # ať o tom přijde upozornění.
      - name: Výsledek scraperů
        if: always() && steps.plan.outputs.scrape == 'true'
        run: |
          if [ '${{ steps.jednani.outcome }}' = failure ]; then
            echo "::warning::scraper_hearings selhal, ostatní výstupy jsou commitnuté"
          fi
          if [ '${{ steps.akce.outcome }}' = failure ]; then
            echo "::warning::scraper_akce selhal, ostatní výstupy jsou commitnuté"
          fi
          selhalo=""
          [ '${{ steps.casopisy.outcome }}' = failure ] && selhalo="$selhalo časopisy"
          [ '${{ steps.prehled.outcome }}' = failure ] && selhalo="$selhalo přehled"
          if [ -n "$selhalo" ]; then
            echo "::error::Selhalo:$selhalo (co se povedlo, je commitnuté)"
            exit 1
          fi
