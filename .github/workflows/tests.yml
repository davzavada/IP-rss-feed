name: Testy

# Přehledy jednání jsou wordové a pdf dokumenty, které soud může kdykoli
# přeformátovat. Testy běží nad uloženými originály (tests/fixtures), takže
# zachytí, když úprava scraperu rozbije parsování nebo filtr IP senátů.
on:
  push:
    paths:
      - 'feed_common.py'
      - 'scraper_hearings.py'
      - 'scraper_journals.py'
      - 'scraper_judikatura.py'
      - 'digest.py'
      - 'judikatura/**'
      - 'api/**'
      - 'docs/data/oblasti.json'
      - 'docs/data/ns_senaty.json'
      - 'test_hearings.py'
      - 'test_journals.py'
      - 'test_judikatura.py'
      - 'test_ai.py'
      - 'test_digest.py'
      - 'hearings_config.json'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt icalendar
      - name: Testy scraperu jednání
        run: python test_hearings.py
      - name: Testy scraperu časopisů
        run: python test_journals.py
      - name: Testy sběru judikatury
        run: python test_judikatura.py
      - name: Testy AI klienta
        run: python test_ai.py
      - name: Testy dvoutýdenního přehledu
        run: python test_digest.py
      # Náhled PDF (api/pdf.js) je funkce Vercelu v Node.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Testy náhledu PDF
        run: node --test tests/test_pdf_api.js
