<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSS Feeds – rss.davidzavada.cz</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 70%; max-width: 1400px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
  h1 { border-bottom: 2px solid #333; padding-bottom: 8px; }
  h2 { margin-top: 30px; color: #555; font-size: 1.1em; }
  h2 a { color: inherit; text-decoration: none; }
  h2 a:hover { text-decoration: underline; }
  .feed-link { display: inline-block; background: #f0f0f0; padding: 4px 10px; border-radius: 4px; font-family: monospace; font-size: 0.9em; text-decoration: none; color: #0366d6; }
  .feed-link:hover { background: #e0e0e0; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
  table.fixed { table-layout: fixed; }
  table.fixed th, table.fixed td { overflow-wrap: anywhere; }
  th { text-align: left; background: #f6f6f6; padding: 6px 8px; border-bottom: 2px solid #ddd; }
  td { padding: 9px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  td a { color: #0366d6; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  /* Sloupce feedu rozhodnutí – užší shrnutí kvůli čitelnosti */
  .col-name { width: 22%; }
  .col-heslo { width: 17%; }
  .col-summary { width: 47%; }
  .col-date { width: 14%; white-space: nowrap; }
  .summary { font-size: 0.92em; color: #3d3d3d; line-height: 1.55; }
  .heslo { display: inline-block; background: #eef2ff; color: #3730a3; font-size: 0.8em; font-weight: 600; padding: 2px 9px; border-radius: 11px; line-height: 1.35; }
  .new-dot { color: #2da44e; font-size: 0.7em; vertical-align: middle; }
  .tag { display: inline-block; font-size: 0.75em; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .tag-ruling { background: #dff0d8; color: #3c763d; }
  .tag-referral { background: #d9edf7; color: #31708f; }
  .tag-appeal { background: #fcf8e3; color: #8a6d3b; }
  .tag-pending { background: #f2dede; color: #a94442; }
  footer { margin-top: 40px; font-size: 0.8em; color: #999; border-top: 1px solid #eee; padding-top: 10px; }
  #loading { color: #999; font-style: italic; }
</style>
</head>
<body>
<h1>RSS Feeds</h1>

<h2><a href="feed.xml">Rozhodnutí senátu 23 Cdo – NS ČR</a></h2>
<div id="feed-nsoud"><p id="loading">Načítám...</p></div>

<h2><a href="ipcuria_feed.xml">CJEU IP case law</a></h2>
<div id="feed-cjeu"><p id="loading">Načítám...</p></div>

<h2><a href="neprimy_ucinek_feed.xml">Nepřímý účinek – NS ČR</a></h2>
<div id="feed-nu"><p id="loading">Načítám...</p></div>

<h2><a href="journals_feed.xml">Právní časopisy</a></h2>
<div id="feed-journals"><p id="loading">Načítám...</p></div>

<footer>Automaticky aktualizováno každý den. Přidejte XML odkazy do RSS čtečky (Zotero, NetNewsWire, Feedly aj.).</footer>

<script>
function loadFeed(url, containerId, columns, tableClass) {
  fetch(url)
    .then(r => r.text())
    .then(xml => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xml, "text/xml");
      const items = doc.querySelectorAll("item");
      const container = document.getElementById(containerId);

      if (items.length === 0) {
        container.innerHTML = "<p>Žádné položky.</p>";
        return;
      }

      let html = "<table" + (tableClass ? ' class="' + tableClass + '"' : "") + "><thead><tr>";
      columns.forEach(c => { html += "<th" + (c.cls ? ' class="' + c.cls + '"' : "") + ">" + c.label + "</th>"; });
      html += "</tr></thead><tbody>";

      items.forEach(item => {
        html += "<tr>";
        columns.forEach(c => {
          html += "<td" + (c.cls ? ' class="' + c.cls + '"' : "") + ">" + c.render(item) + "</td>";
        });
        html += "</tr>";
      });

      html += "</tbody></table>";
      container.innerHTML = html;
    })
    .catch(() => {
      document.getElementById(containerId).innerHTML = "<p>Nepodařilo se načíst feed.</p>";
    });
}

function getTag(title) {
  const m = title.match(/^\[(\w+)\]/);
  if (!m) return "";
  const t = m[1].toLowerCase();
  return '<span class="tag tag-' + t + '">' + m[1] + '</span>';
}

function getDate(item) {
  const pd = item.querySelector("pubDate");
  if (!pd) return "";
  const d = new Date(pd.textContent);
  return d.toLocaleDateString("cs-CZ");
}

function getTitle(item) {
  const t = item.querySelector("title").textContent;
  const link = item.querySelector("link").textContent;
  const clean = t.replace(/^\[\w+\]\s*/, "");
  return newDot(item) + '<a href="' + link + '">' + clean + '</a>';
}

function newDot(item) {
  return item.querySelector("is-new")
    ? '<span class="new-dot" title="Nové dnes">●</span> '
    : '';
}

loadFeed("feed.xml", "feed-nsoud", [
  { label: "Název", cls: "col-name", render: i => newDot(i) + '<a href="' + i.querySelector("link").textContent + '">' + i.querySelector("title").textContent + '</a>' },
  { label: "Heslo", cls: "col-heslo", render: i => {
    const tagEl = i.querySelector("ai-tag");
    const tag = tagEl ? tagEl.textContent.trim() : "";
    return tag ? '<span class="heslo">' + tag + '</span>' : "";
  } },
  { label: "Shrnutí", cls: "col-summary", render: i => {
    const sumEl = i.querySelector("ai-summary");
    const summary = sumEl ? sumEl.textContent.trim() : "";
    if (!summary) return "";
    return '<span class="summary">' + summary + '</span>';
  } },
  { label: "Datum", cls: "col-date", render: getDate }
], "fixed");

loadFeed("ipcuria_feed.xml", "feed-cjeu", [
  { label: "Typ", render: i => getTag(i.querySelector("title").textContent) },
  { label: "Případ", render: getTitle },
  { label: "Datum", render: getDate }
]);

loadFeed("neprimy_ucinek_feed.xml", "feed-nu", [
  { label: "Název", render: i => newDot(i) + '<a href="' + i.querySelector("link").textContent + '">' + i.querySelector("title").textContent + '</a>' },
  { label: "Datum", render: getDate }
]);

loadFeed("journals_feed.xml", "feed-journals", [
  { label: "Časopis", render: i => newDot(i) + '<a href="' + i.querySelector("link").textContent + '">' + i.querySelector("title").textContent + '</a>' },
  { label: "PDF", render: i => '<a href="' + i.querySelector("link").textContent + '">Stáhnout</a>' }
]);
</script>
</body>
</html>
